name: Build and Release

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Source checks and unit tests
        run: npm run check
      - name: Linux Electron integration smoke test
        if: runner.os == 'Linux'
        run: PHW_SMOKE_TEST=1 xvfb-run -a npx electron . --no-sandbox
      - name: Build desktop packages
        run: node scripts/build-with-retry.js
      - uses: actions/upload-artifact@v4
        with:
          name: puzzle-hunt-workbench-${{ runner.os }}-${{ runner.arch }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.tar.gz
            dist/*.blockmap
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          pattern: puzzle-hunt-workbench-*
          path: release-artifacts
          merge-multiple: true
      - name: Validate release version transition
        id: version
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          PREVIOUS_VERSION="$(git show HEAD^:package.json 2>/dev/null | node -e "let s='';process.stdin.on('data',d=>s+=d);process.stdin.on('end',()=>{try{console.log(JSON.parse(s).version||'')}catch{console.log('')}})" || true)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ "$VERSION" = "$PREVIOUS_VERSION" ]; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "package.json version is unchanged ($VERSION); build validated, release intentionally skipped."
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "Release version changed: ${PREVIOUS_VERSION:-none} -> $VERSION"
          fi
      - name: Create GitHub Release
        if: steps.version.outputs.release == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release tag $TAG already exists; refusing to replace an existing release."
            exit 1
          fi
          gh release create "$TAG" release-artifacts/* \
            --target "$GITHUB_SHA" \
            --title "Puzzle Hunt Workbench $TAG" \
            --notes-file docs/RELEASE_NOTES.md
