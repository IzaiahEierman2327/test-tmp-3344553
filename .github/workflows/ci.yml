name: CI

on:
  push:
    branches: [develop, main, agent/v0.1.2-hardening]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Source checks and unit tests
        run: npm run check
      - name: Electron integration smoke test
        run: PHW_SMOKE_TEST=1 xvfb-run -a npx electron . --no-sandbox
